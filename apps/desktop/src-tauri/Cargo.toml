[package]
name = "health360-desktop"
version = "0.0.0"
description = "Health360 desktop app: the Expo web build in a Tauri shell"
edition = "2021"
publish = false

[lib]
name = "health360_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
