name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Edge Functions use an up-to-date copy of packages/domain and packages/schemas
        run: pnpm codegen:check

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - working-directory: supabase/functions/ai-hello
        run: |
          deno check index.ts handler.ts
          deno test --no-prompt

  database:
    name: Database (pgTAP, lint, drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: pnpm install --frozen-lockfile
      - run: supabase db start
      - run: supabase test db
      - run: supabase db lint --level warning --fail-on error
      - name: Client schema matches Postgres
        run: pnpm drift:check
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  sync:
    name: Two-client sync (Supabase + PowerSync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (database, auth and REST only)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta
      - name: Export Supabase settings
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "PS_SUPABASE_JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"
      - name: Start PowerSync
        run: |
          docker compose -f powersync/docker-compose.yml up -d
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/probes/liveness >/dev/null && exit 0
            sleep 2
          done
          docker compose -f powersync/docker-compose.yml logs powersync
          exit 1
      - name: Leak and offline tests
        run: pnpm --filter @health360/e2e-sync test
        env:
          SYNC_E2E: '1'
          POWERSYNC_URL: http://127.0.0.1:8080
      - name: PowerSync logs
        if: failure()
        run: docker compose -f powersync/docker-compose.yml logs powersync
